<body>

    <h1>PROGRAM TO CHECK IF A NUMBER IS ODD OR EVEN</h1>


    <script>
        let number =parseInt(prompt("Please insert a Number: "));
        let result = number % 2;
        if(result == 1){
        console.log("The Number is an Odd Number");
        }else if(result == 0){
        console.log("The Number is an Even Number");
        }else{
        console.log("Invalid Input")
        }

    </script>
    
</body>
